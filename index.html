<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Question For You ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: "DM Sans", sans-serif;

            color: #a83252;

            background:
                radial-gradient(
                    circle at 8% 12%,
                    rgba(255, 188, 201, .72),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 92% 82%,
                    rgba(220, 241, 232, .65),
                    transparent 34%
                ),
                linear-gradient(
                    135deg,
                    #fff2f4 0%,
                    #fffafa 48%,
                    #f8fffc 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            position: relative;
        }


        /* =========================================================
           BACKGROUND GLOW
        ========================================================= */

        body::before {
            content: "";
            position: fixed;

            width: 520px;
            height: 520px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: rgba(255, 190, 204, .22);

            filter: blur(100px);

            border-radius: 50%;

            pointer-events: none;
        }


        /* =========================================================
           FLOATING HEARTS
        ========================================================= */

        .hearts {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }

        .heart {
            position: absolute;

            color: rgba(211, 63, 96, .20);

            font-size: 22px;

            animation:
                floatHeart linear infinite,
                heartPulse 3s ease-in-out infinite;

            user-select: none;
        }

        .heart:nth-child(1) {
            left: 7%;
            bottom: -30px;
            animation-duration: 14s;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 18%;
            bottom: -30px;
            animation-duration: 17s;
            animation-delay: 3s;
            font-size: 17px;
        }

        .heart:nth-child(3) {
            left: 31%;
            bottom: -30px;
            animation-duration: 13s;
            animation-delay: 5s;
            font-size: 27px;
        }

        .heart:nth-child(4) {
            left: 53%;
            bottom: -30px;
            animation-duration: 18s;
            animation-delay: 2s;
            font-size: 15px;
        }

        .heart:nth-child(5) {
            left: 69%;
            bottom: -30px;
            animation-duration: 15s;
            animation-delay: 7s;
            font-size: 25px;
        }

        .heart:nth-child(6) {
            left: 84%;
            bottom: -30px;
            animation-duration: 19s;
            animation-delay: 1s;
            font-size: 18px;
        }

        .heart:nth-child(7) {
            left: 94%;
            bottom: -30px;
            animation-duration: 16s;
            animation-delay: 6s;
            font-size: 29px;
        }

        @keyframes floatHeart {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .7;
            }

            90% {
                opacity: .5;
            }

            to {
                transform: translateY(-115vh) rotate(25deg);
                opacity: 0;
            }
        }

        @keyframes heartPulse {
            0%,
            100% {
                scale: 1;
            }

            50% {
                scale: 1.15;
            }
        }


        /* =========================================================
           MAIN CARD
        ========================================================= */

        .card {
            width: min(900px, 100%);

            min-height: 690px;

            padding: 58px 55px 48px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.94),
                    rgba(255,249,250,.91)
                );

            border: 1px solid rgba(255,255,255,.9);

            border-radius: 36px;

            box-shadow:
                0 35px 80px rgba(156, 58, 85, .12),
                0 10px 25px rgba(156, 58, 85, .06),
                inset 0 1px 0 rgba(255,255,255,.95);

            backdrop-filter: blur(18px);

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            z-index: 2;

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            top: -180px;
            right: -120px;

            background: rgba(255, 173, 192, .20);

            filter: blur(20px);

            border-radius: 50%;
        }


        /* =========================================================
           PAGE CONTENT
        ========================================================= */

        .page {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            animation: pageIn .55s ease both;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           PHOTO
        ========================================================= */

        .photo-wrap {
            width: 170px;
            height: 170px;

            padding: 7px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #ffd9e1
                );

            box-shadow:
                0 15px 35px rgba(209, 63, 98, .15),
                0 0 0 1px rgba(255,255,255,.9);

            margin-bottom: 32px;

            position: relative;
        }

        .photo-wrap::after {
            content: "♡";

            position: absolute;

            right: -5px;
            bottom: 5px;

            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 50%;

            color: #e15a79;

            font-size: 18px;

            box-shadow: 0 8px 18px rgba(120, 30, 60, .12);
        }

        .photo {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            display: block;
        }

        .surprise-photos {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .surprise-photos .photo-wrap {
            width: 135px;
            height: 135px;
            margin-bottom: 0;
        }


        /* =========================================================
           PUPPY IMAGE
        ========================================================= */

        .puppy-photo {
            object-fit: contain;

            background: white;
        }


        /* =========================================================
           EYEBROW
        ========================================================= */

        .eyebrow {
            margin-bottom: 16px;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: .15em;

            text-transform: uppercase;

            color: #d23f62;
        }


        /* =========================================================
           MAIN TITLE
        ========================================================= */

        h1 {
            max-width: 760px;

            margin: 0 auto;

            font-family: "Playfair Display", serif;

            font-size: clamp(48px, 7vw, 78px);

            line-height: 1.02;

            font-weight: 600;

            letter-spacing: -.035em;

            color: #c9365a;

            text-wrap: balance;
        }

        h1 .heart-title {
            color: #ff8097;

            display: inline-block;

            margin-left: 7px;

            animation: titleHeart 2.2s ease-in-out infinite;
        }

        @keyframes titleHeart {
            0%,
            100% {
                transform: scale(1) rotate(-4deg);
            }

            50% {
                transform: scale(1.13) rotate(4deg);
            }
        }


        /* =========================================================
           DESCRIPTION
        ========================================================= */

        .description {
            margin-top: 28px;

            font-size: 17px;

            line-height: 1.7;

            color: #92717a;

            max-width: 580px;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .buttons {
            margin-top: 42px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 18px;

            width: 100%;
        }

        button {
            border: none;

            font-family: "DM Sans", sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            border-radius: 18px;

            height: 70px;

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                filter .22s ease;
        }

        button:focus-visible {
            outline: 3px solid rgba(209, 63, 98, .25);
            outline-offset: 4px;
        }


        /* IMPORTANT:
           YES AND NO HAVE FIXED WIDTH.
           NO WILL NEVER SHRINK.
        */

        .yes-btn,
        .no-btn {
            width: 190px;
            min-width: 190px;
        }

        .yes-btn {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #d63f65,
                    #ca3458
                );

            box-shadow:
                0 15px 30px rgba(203, 52, 88, .25);
        }

        .yes-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 20px 38px rgba(203, 52, 88, .32);

            filter: brightness(1.03);
        }

        .no-btn {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #f39a89,
                    #ee8878
                );

            box-shadow:
                0 12px 25px rgba(238, 136, 120, .20);
        }

        .no-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 18px 32px rgba(238, 136, 120, .27);
        }

        button:active {
            transform: translateY(1px) !important;
        }


        /* =========================================================
           FOOTER TEXT
        ========================================================= */

        .footer-note {
            margin-top: 28px;

            font-size: 14px;

            color: #a28188;

            letter-spacing: .01em;
        }


        /* =========================================================
           YES SUCCESS PAGE
        ========================================================= */

        .success-title {
            color: #c9365a;
        }

        .success-message {
            max-width: 650px;

            margin-top: 26px;

            font-size: 19px;

            line-height: 1.8;

            color: #8d6872;
        }

        .big-heart {
            font-size: 68px;

            margin-top: 24px;

            animation: bigHeart 1.3s ease-in-out infinite;
        }

        .flow-button {
            width: 240px;
            min-width: 240px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            color: white;
            background: linear-gradient(135deg, #d63f65, #ca3458);
            box-shadow: 0 15px 30px rgba(203, 52, 88, .25);
            text-decoration: none;
        }

        .flow-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 38px rgba(203, 52, 88, .32);
        }

        .song-player {
            display: none;
            width: min(100%, 760px);
            aspect-ratio: 16 / 9;
            margin-top: 28px;
            border: 0;
            border-radius: 18px;
            box-shadow: 0 16px 34px rgba(91, 35, 55, .18);
        }

        .gift-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 34px;
        }

        .gift-card {
            min-height: 190px;
            padding: 24px 16px;
            color: #a83252;
            background: rgba(255, 241, 245, .88);
            border: 1px solid rgba(211, 63, 96, .12);
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(156, 58, 85, .08);
        }

        .gift-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 30px rgba(156, 58, 85, .15);
        }

        .gift-card strong {
            display: block;
            margin-bottom: 8px;
            font-family: "Playfair Display", serif;
            font-size: 20px;
        }

        .gift-card small {
            color: #92717a;
            font-size: 13px;
            line-height: 1.5;
        }

        .memory-board {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 28px;
        }

        .memory-item {
            min-width: 0;
            margin: 0;
        }

        .memory-photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            padding: 6px;
            background: white;
            border: 1px solid #f1c2cd;
            box-shadow: 0 8px 18px rgba(156, 58, 85, .10);
            cursor: zoom-in;
            transition: transform .22s ease, box-shadow .22s ease;
        }

        .memory-photo:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 14px 24px rgba(156, 58, 85, .18);
        }

        .memory-item:nth-child(odd) .memory-photo { transform: rotate(-1.5deg); }
        .memory-item:nth-child(even) .memory-photo { transform: rotate(1.5deg); }

        .memory-caption {
            display: block;
            margin-top: 8px;
            color: #92717a;
            font-size: 12px;
            line-height: 1.35;
        }

        .memory-lightbox {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(65, 25, 40, .72);
            backdrop-filter: blur(8px);
        }

        .memory-lightbox.open { display: flex; }

        .memory-lightbox img {
            max-width: min(92vw, 900px);
            max-height: 84vh;
            object-fit: contain;
            padding: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 24px 70px rgba(30, 10, 20, .35);
        }

        .lightbox-close {
            position: absolute;
            top: 22px;
            right: 26px;
            width: 46px;
            min-width: 46px;
            height: 46px;
            color: #a83252;
            background: white;
            border-radius: 50%;
            font-size: 24px;
            line-height: 1;
        }

        .flow-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .flow-actions button {
            width: 210px;
            min-width: 210px;
            height: 58px;
        }

        .secondary-button {
            margin-top: 28px;
            color: #c9365a;
            background: #fff1f4;
            border: 1px solid #efb8c5;
        }

        .secondary-button:hover {
            transform: translateY(-3px);
            background: #ffe5eb;
        }

        .record {
            width: 190px;
            height: 190px;
            display: block;
            padding: 0;
            margin: 28px auto;
            border: 0;
            border-radius: 50%;
            background: radial-gradient(circle, #f4b5c4 0 12%, #c56c83 13% 17%, #22151b 18% 62%, #44303a 63% 67%, #171017 68% 100%);
            box-shadow: 0 18px 38px rgba(62, 29, 42, .24);
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .record:hover {
            transform: scale(1.04);
            box-shadow: 0 22px 44px rgba(62, 29, 42, .30);
        }

        .record.playing {
            animation: recordSpin 8s linear infinite;
        }

        @keyframes recordSpin {
            to { transform: rotate(360deg); }
        }

        .record::after {
            content: "♡";
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin: 66px auto;
            border-radius: 50%;
            background: #f4b5c4;
            color: #a83252;
            font-size: 25px;
        }

        .song-hint {
            margin-top: -12px;
            color: #a83252;
            font-size: 13px;
            letter-spacing: .04em;
        }

        .song-photo {
            width: 190px;
            height: 190px;
            overflow: hidden;
            margin: 0 auto 35px;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(120, 40, 70, .15);
        }

        .song-photo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .letter-card {
            max-width: 650px;
            margin-top: 26px;
            padding: 30px;
            text-align: left;
            background: #fffdf8;
            border: 1px solid #eadfcf;
            border-radius: 12px;
            color: #63454d;
            font-family: Georgia, serif;
            line-height: 1.8;
        }

        .letter-card p { margin-bottom: 16px; }

        .final-title {
            color: #c9365a;
            font-family: "Playfair Display", serif;
            font-size: clamp(48px, 8vw, 80px);
        }

        @keyframes bigHeart {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }


        /* =========================================================
           FINAL NO PAGE
        ========================================================= */

        .final-page h1 {
            font-size: clamp(42px, 6vw, 70px);
        }

        .final-page .description {
            margin-top: 24px;
        }

        .return-btn {
            margin-top: 38px;

            width: 300px;
            min-width: 300px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #d94368,
                    #c93458
                );

            box-shadow:
                0 16px 32px rgba(201, 52, 88, .25);
        }

        .return-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 20px 38px rgba(201, 52, 88, .32);
        }


        /* =========================================================
           LITTLE DECORATIONS
        ========================================================= */

        .decor {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 30px;

            margin-top: 38px;

            color: #f19aae;

            font-size: 23px;
        }

        .decor span:nth-child(2) {
            font-size: 10px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        /* TABLET */
        @media (min-width: 701px) and (max-width: 1024px) {

            body {
                padding: 28px 20px;
            }

            .card {
                min-height: 680px;
                padding: 52px 38px 44px;
            }

            .gift-grid,
            .memory-board {
                grid-template-columns: repeat(2, 1fr);
            }

            .memory-photo {
                height: 180px;
            }

            .flow-actions button,
            .flow-button {
                width: min(100%, 250px);
                min-width: 0;
            }
        }


        /* PHONE */
        @media (max-width: 700px) {

            body {
                padding: 18px;
            }

            .card {
                min-height: 650px;

                padding: 45px 22px 38px;

                border-radius: 28px;
            }

            .photo-wrap {
                width: 135px;
                height: 135px;

                margin-bottom: 26px;
            }

            .photo-wrap::after {
                width: 30px;
                height: 30px;

                font-size: 15px;
            }

            .eyebrow {
                font-size: 11px;

                letter-spacing: .12em;
            }

            h1 {
                font-size: clamp(42px, 12vw, 60px);
            }

            .description {
                font-size: 15px;

                max-width: 330px;
            }

            .buttons {
                gap: 10px;
            }

            .yes-btn,
            .no-btn {
                width: 145px;
                min-width: 145px;

                height: 62px;

                font-size: 15px;
            }

            .return-btn {
                width: 270px;
                min-width: 270px;
            }

            .gift-grid,
            .memory-board {
                grid-template-columns: 1fr;
            }

            .memory-photo {
                height: 220px;
            }

            .flow-actions button,
            .flow-button {
                width: min(100%, 280px);
                min-width: 0;
            }
        }


        /* =========================================================
           VERY SMALL PHONES
        ========================================================= */

        @media (max-width: 390px) {

            .card {
                padding-left: 16px;
                padding-right: 16px;
            }

            .yes-btn,
            .no-btn {
                width: 135px;
                min-width: 135px;
            }

            h1 {
                font-size: 39px;
            }
        }

    </style>
</head>

<body>

    <!-- FLOATING HEARTS -->
    <div class="hearts" aria-hidden="true">
        <span class="heart">♡</span>
        <span class="heart">♡</span>
        <span class="heart">♥</span>
        <span class="heart">♡</span>
        <span class="heart">♥</span>
        <span class="heart">♡</span>
        <span class="heart">♡</span>
    </div>


    <!-- MAIN CARD -->
    <main class="card" id="card">
        <!-- JavaScript puts the page here -->
    </main>

    <div class="memory-lightbox" id="memoryLightbox" role="dialog" aria-modal="true" aria-label="Expanded memory photo">
        <button class="lightbox-close" type="button" aria-label="Close photo">×</button>
        <img id="lightboxImage" src="" alt="Expanded memory">
    </div>


    <script>

        /* =========================================================
           CONFIGURATION
        ========================================================= */

        const girlImage = "images/llouren1.jpg";
        const puppyImage = "images/sad puppy.png";


        /* =========================================================
           NO BUTTON MESSAGES
        ========================================================= */

        const noPages = [

            {
                eyebrow: "THINK AGAIN...",
                title: "Wait... are you sure? 🥺"
            },

            {
                eyebrow: "THE YES BUTTON IS WAITING.",
                title: "Nah, that's not right... 😭"
            },

            {
                eyebrow: "I KNOW YOU WANT TO CLICK YES.",
                title: "Be serious... 😭"
            },

            {
                eyebrow: "ONE MORE CHANCE?",
                title: "Okay, now you're just playing... 🥹"
            },

            {
                eyebrow: "PLEASE? ♡",
                title: "Okay, last chance... 🥺"
            }

        ];


        /* =========================================================
           STATE
        ========================================================= */

        let noIndex = 0;


        /* =========================================================
           MAIN CARD
        ========================================================= */

        const card = document.getElementById("card");
        const memoryLightbox = document.getElementById("memoryLightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxClose = document.querySelector(".lightbox-close");

        function openMemory(src, alt) {
            lightboxImage.src = src;
            lightboxImage.alt = alt;
            memoryLightbox.classList.add("open");
        }

        function closeMemory() {
            memoryLightbox.classList.remove("open");
            lightboxImage.src = "";
        }

        lightboxClose.addEventListener("click", closeMemory);
        memoryLightbox.addEventListener("click", event => {
            if (event.target === memoryLightbox) closeMemory();
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeMemory();
        });


        /* =========================================================
           INITIAL PAGE
        ========================================================= */

        function showStart() {

            noIndex = 0;

            card.innerHTML = `

                <section class="page">

                    <div class="photo-wrap">
                        <img
                            class="photo"
                            src="${girlImage}"
                            alt="A special photo"
                        >
                    </div>

                    <div class="eyebrow">
                        A LITTLE QUESTION FOR YOU...
                    </div>

                    <h1>
                        Will you be my
                        <br>
                        girlfriend?
                        <span class="heart-title">♥</span>
                    </h1>

                    <div class="buttons">

                        <button
                            class="yes-btn"
                            onclick="showYes()"

        function playSong() {

            const recordButton = document.getElementById("recordButton");
            const songPlayer = document.getElementById("songPlayer");
            const playHint = document.getElementById("playHint");

            const command = recordButton.classList.contains("playing")
                ? "pauseVideo"
                : "playVideo";

            songPlayer.contentWindow.postMessage(
                JSON.stringify({
                    event: "command",
                    func: command,
                    args: []
                }),
                "*"
            );

            const isPlaying = command === "playVideo";
            recordButton.classList.toggle("playing", isPlaying);
            recordButton.setAttribute("aria-pressed", String(isPlaying));
            playHint.textContent = isPlaying ? "Playing ♡" : "Click to play ♡";
        }
